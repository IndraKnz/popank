[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Aplikasi memakai hash routing (#/w/...), tapi ini menjaga kalau nanti ada
# tautan tanpa hash / path dalam.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Aset ber-hash boleh di-cache lama; HTML jangan.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
